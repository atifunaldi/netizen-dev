name: Netizen Drive TestFlight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  distribute:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify signing secrets exist
        env:
          CERT: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          PASS: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_PROFILE: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64 }}
          WIDGET_PROFILE: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          for name in CERT PASS APP_PROFILE WIDGET_PROFILE KEY_ID ISSUER API_KEY; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing secret: $name"; exit 1; fi
          done
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'
      - name: Verify iOS 26 SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Generate AppIcon PNG
        run: swift CarPlayPrototype/generate-app-icon.swift
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Install signing credentials
        env:
          CERT: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          PASS: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_PROFILE: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64 }}
          WIDGET_PROFILE: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_BASE64 }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/netizen-signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 24)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASS=$KEYCHAIN_PASS" >> "$GITHUB_ENV"
          printf '%s' "$CERT" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN" -P "$PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APP_PROFILE" | base64 -D > "$RUNNER_TEMP/app.mobileprovision"
          printf '%s' "$WIDGET_PROFILE" | base64 -D > "$RUNNER_TEMP/widget.mobileprovision"
          for kind in app widget; do
            security cms -D -i "$RUNNER_TEMP/$kind.mobileprovision" > "$RUNNER_TEMP/$kind.plist"
            uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/$kind.plist")
            cp "$RUNNER_TEMP/$kind.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          done
          printf '%s\n' "$API_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
      - name: Generate Xcode project
        working-directory: CarPlayPrototype
        run: xcodegen generate
      - name: Archive signed iPhone app
        working-directory: CarPlayPrototype
        run: |
          xcodebuild -project NetizenDrive.xcodeproj -scheme NetizenDrive -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/NetizenDrive.xcarchive" archive
      - name: Verify archived Drive version
        run: |
          set -euo pipefail
          plist="$RUNNER_TEMP/NetizenDrive.xcarchive/Products/Applications/NetizenDrive.app/Info.plist"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")
          echo "Archived Drive: $version ($build)"
          test "$version" = "1.2"
          test "$build" = "4"
      - name: Export App Store IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string>WV5R646K3B</string>
          <key>provisioningProfiles</key><dict>
          <key>com.netizen.drive</key><string>NetizenDrive_AppStore</string>
          <key>com.netizen.drive.widget</key><string>NetizenDrive_Widget_AppStore</string>
          </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/NetizenDrive.xcarchive" -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Verify exported Drive IPA
        run: |
          set -euo pipefail
          ipa=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$ipa"
          unzip -p "$ipa" 'Payload/NetizenDrive.app/Info.plist' > "$RUNNER_TEMP/drive-export-info.plist"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/drive-export-info.plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/drive-export-info.plist")
          echo "Exported Drive IPA: $version ($build)"
          test "$version" = "1.2"
          test "$build" = "4"
      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          ipa=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$ipa"
          set -o pipefail
          xcrun altool --upload-app -f "$ipa" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER" 2>&1 | tee "$RUNNER_TEMP/upload.log"
          if grep -Eq "UPLOAD FAILED|Failed to upload|Validation failed|ERROR:.*bundle version" "$RUNNER_TEMP/upload.log"; then
            echo "::error::Apple rejected the Drive upload"; exit 1
          fi
      - name: Remove local signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/app.mobileprovision" "$RUNNER_TEMP/widget.mobileprovision"
