name: NetizenDrive
options:
  bundleIdPrefix: com.netizen
  deploymentTarget:
    iOS: "17.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  NetizenDrive:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Netizen Drive
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.netizen.drive
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
    dependencies:
      - target: NetizenDriveWidget
        embed: true
  NetizenDriveWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared/DriveActivityAttributes.swift
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Netizen Drive Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.netizen.drive.widget
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
