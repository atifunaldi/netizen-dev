name: NetizenDrive
options:
  bundleIdPrefix: com.netizen
  deploymentTarget:
    iOS: "17.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  NetizenDrive:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Netizen Drive
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "3"
        UILaunchScreen: {}
        CFBundleIconName: AppIcon
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.netizen.drive
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
      configs:
        Release:
          CODE_SIGNING_ALLOWED: "YES"
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: WV5R646K3B
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: NetizenDrive_AppStore
    dependencies:
      - target: NetizenDriveWidget
        embed: true
  NetizenDriveWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared/DriveActivityAttributes.swift
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Netizen Drive Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.netizen.drive.widget
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
      configs:
        Release:
          CODE_SIGNING_ALLOWED: "YES"
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: WV5R646K3B
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: NetizenDrive_Widget_AppStore
